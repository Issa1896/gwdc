# ============================================================
# GWDC — NGINX API Gateway / Reverse Proxy (Módulo 12)
# Termina TLS, entrega estáticos e roteia para a aplicação.
# ============================================================

upstream gwdc_web {
    server web:3000;
    keepalive 64;
}

# HTTP → HTTPS (produção com certificado)
server {
    listen 80;
    server_name gwdigital.company www.gwdigital.company;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gwdigital.company www.gwdigital.company;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Segurança
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # Compressão
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Proteção básica
    client_max_body_size 25m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # Cache de estáticos (gerados pelo Next.js)
    location /_next/static/ {
        proxy_pass http://gwdc_web;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://gwdc_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade"; # WebSocket (chat IA, live)
        proxy_read_timeout 60s;
    }

    # Saúde
    location /healthz {
        access_log off;
        proxy_pass http://gwdc_web;
    }
}

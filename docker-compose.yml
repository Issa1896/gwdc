services:
  postgres:
    image: postgres:16-alpine
    container_name: gwdc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gwdc_user
      POSTGRES_PASSWORD: gwdc_password
      POSTGRES_DB: gwdc_db
    ports:
      - "5432:5432"
    volumes:
      - gwdc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gwdc_user -d gwdc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gwdc_pgdata:
    name: gwdc_pgdata
